<html >
<head>
    
    <title>Change from a Purchase</title>

    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">

    <style>
        body{
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
            min-height: 100vh;
        }

        .card-header-gradient{
            background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
            color: #fff;
            border-radius: 1rem 1rem 0 0;
        }
        .result-box{
            background: #f8f9fa;
            border-left: 5px solid #0d6efd;
        }
    </style>

</head>
<body>

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow-lg border-0 rounded-4 overflow-hidden " >

                    <div class="card-header-gradient text-center py-4">
                        <i class="bi bi-cash-coin fs-1"></i>
                        <h3 class="mt-2 mb-0">Change from a Purchase</h3>
                    </div>

                    <div class="card-body p-4">


                        <div class="alert alert-light border small">
                            <strong>Question: </strong> You pay with cash for items costing a certain amount. How much change?<br>
                            <strong> Formula: </strong> amountPaid - itemCost 
                        </div>

                        <div class="form-floating mb-3">
                            <input type="number" class="form-control " id="amountPaid" placeholder="">
                            <label for="amountPaid">Amount Paid</label>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="number" class="form-control" id="itemCost" placeholder="Item Cost">
                            <label for="itemCost">Item Cost</label>
                        </div>


                        <div class="input-group mb-4">
                            <span class="input-group-text"><i class="bi bi-currency-exchange"></i></span>
                            <select  id="currency" class="form-select">
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="GBP">GBP</option>
                                <option value="UGX">UGX</option>
                            </select>
                        </div>


                        <button onclick="calculateChange()" class="btn btn-primary w-100 rounded-pill py-2">
                            <i class="bi bi-calculator"></i>
                            Calculate
                        </button>


                        <div id="output" class="result-box mt-4 rounded fs-5 fw-bold text-center"></div>

                    </div>
                </div>

            </div>
        </div>
    </div>
  

    <script src="calculate_change.js"></script>
    
</body>
</html>

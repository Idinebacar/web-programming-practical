<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Splitting a Bill</title>

    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">

</head>

<body>
    <div class="container py-5">

        <div class="card-body">

                <h3 class="card-title text-center mb-4">
                    Splitting a Bill
                </h3>

                <div class="alert alert-secondary small">

                    <strong>Question:</strong> Friends share a dinner bill equally. How much does each pay? <br>
                    <strong>Formula:</strong> totalBill / numberOfFriends

                </div>

                <div claas="mb-3">
                    <label for="totalBill" class="form-label">Total Bill</label>
                    <input type="number" id="totalBill" class="form-control">
                </div>


                <div claas="mb-3">
                    <label for="num_of_friends" class="form-label">Number Of Friends</label>
                    <input type="number" id="num_of_friends" class="form-control">
                </div>

                <div claas="mb-3">
                    <label for="roundUp" class="form-label">Round Up?</label>
                    <select id="roundUp" class="form-select">
                        <option value="yes">Yes</option>
                        <option value="no" selected="no">No</option>
                    </select>
                </div>

                <button onclick="CalculateSplit()" class="btn btn-primary w-100 mt-4">Calculate</button>

                <p id="output" class=" mt-4 fs-5 text-center fw-bold "></p>

        </div>


        <script src="calculate_split.js"></script>

    </div>
</body>
</html>

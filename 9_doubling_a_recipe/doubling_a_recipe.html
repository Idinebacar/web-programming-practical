<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doubling a Recipe</title>
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col shadow-sm">
                <div class="card-body py-4">
                    <h2 class="text-center mb-4">Doubling a Recipe</h2>

                    <div class="mb-3">

                        <label for="flour" class="form-lable">Amount of Flour</label>
                        <input type="number" id="flour" class="form-control" placeholder="e.g 2000">

                        <div class="form-text ">Enter the amount used in the original recipe.

                        </div>

                        <div class="mb-3">
                            <label for="people" class="form-lable">Original Number of People </label>
                            <input type="number" id="people" class="form-control" placeholder="e.g. 4">
                        </div>

                        <div class="mb-3">
                            <label for="newPeople" class="form-lable">New Number of People </label>
                            <input type="number" id="newPeople" class="form-control" placeholder="e.g. 8">
                        </div>

                        <div class="mb-3">
                            <label for="ingredient" class="form-label">Ingredient</label>
                            <select id="ingredient" class="form-select">
                                <option value="Flour" selected>Flour</option>
                                <option value="Sugar">Sugar</option>
                                <option value="Milk">Milk</option>
                                <option value="Rice">Rice</option>
                            </select>

                        </div>

                        <button onclick="calculate_recipe()" class="btn btn-primary w-100">Calculate</button>


                        <div class="collapse mt-4" id="resultCollapse">
                            <div class="alert alert-success text-center mb-0" id="output"></div>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="calculate_recipe.js"></script>
    
</body>
</html>

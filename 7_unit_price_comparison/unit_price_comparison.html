<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Price Comparison</title>

    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css" >

    <style>

        body {
            background-color: #f4f6f8;
        }

        .card-header-dark {
            background-color: #212529;
            color: #fff;
        }

        .result-badge {
            font-size: 1.1rem;
            padding: 0.75rem 1rem;
        }
    </style>
</head>

<body>

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow border-0">

                    <div class="card-header-dark text-center py-3 rounded-top-4">

                        <i class="bi bi-tags-fill me-2"></i>
                        <span class="fs-4 fw-semibold">Unit Price Comparison</span>

                    </div>

                    <div class="card-body p-4">

                        <div class="alert alert-secondary small">

                            <strong>Question:</strong> A pack of a given weight costs a given price. What is the price
                            per 100g?<br>
                            <strong>Formula:</strong> (price / weight) * 100

                        </div>

                       
                        <div class="mb-3">

                            <label for="price" class="form-label fw-semibold">Price</label>

                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" id="price" class="form-control" placeholder="e.g. 5">
                            </div>

                        </div>


                        <div class="mb-3">
                            <label for="weight" class="form-label fw-semibold">Weight / Volume</label>
                            <input type="number" id="weight" class="form-control" placeholder="e.g. 250">
                        </div>


                        <div class="mb-4">

                            <label for="unit" class="form-label fw-semibold">Unit</label>
                            <select id="unit" class="form-select">
                                <option value="grams">Grams</option>
                                <option value="kg">Kg</option>
                                <option value="ml">ml</option>
                                <option value="litres">Litres</option>
                            </select>

                        </div>

                        <button onclick="calculateUnitPrice()" class="btn btn-outline-dark w-100">
                            <i class="bi bi-calculator"></i> Calculate
                        </button>



                        <div class="text-center mt-4">
                            <span id="output" class="badge bg-dark result-badge"></span>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="calculate_unit_price.js"></script>

   
</body>

</html>

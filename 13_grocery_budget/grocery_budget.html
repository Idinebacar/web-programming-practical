<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Budget</title>
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar bg-primary" data-bs-theme="dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Grocery Budget</span>
    </div>
</nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body p-4">

                    <div class="mb-3">
                        <label for="budget" class="form-label">Budget</label>
                        <input type="number" class="form-control" id="budget" placeholder="Enter your budget" min="0">
                    </div>

                    <div class="mb-3">
                        <label for="item1" class="form-label">First Item</label>
                        <input type="number" class="form-control" id="item1" placeholder="Enter item cost" min="0">
                    </div>

                    <div class="mb-3">
                        <label for="item2" class="form-label">Second Item</label>
                        <input type="number" class="form-control" id="item2" placeholder="Enter item cost" min="0">
                    </div>

                    <div class="mb-3">
                        <label for="item3" class="form-label">Third Item</label>
                        <input type="number" class="form-control" id="item3" placeholder="Enter item cost" min="0">
                    </div>

                     <div class="mb-3">
                        <label for="store" class="form-label">Store</label>
                        <select id="store" class="form-select">
                        <option value="Supermarket">Supermarket</option>
                        <option value="Market">Market</option>
                        <option value="Online">Online</option>
                        <option value="Local Shop">Local Shop</option>
                        </select>
                    </div>

                    <button class="btn btn-primary w-100" type="button" onclick="calculateGroceryBudget()">Calculate</button>
                </div>

                <div class="card-footer text-body-secondary">
                    <p id="output" class="mb-0 fw-semibold"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="calculate_grocery_budget.js"></script>

</body>
</html>
